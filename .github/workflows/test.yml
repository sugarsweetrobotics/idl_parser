name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # reused by release.yml before building

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover --start-directory tests --pattern '*_test.py' --top-level-directory . --verbose

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests with coverage
        run: |
          python -m pip install coverage
          python -m coverage run --branch --source=idl_parser -m unittest discover --start-directory tests --pattern '*_test.py' --top-level-directory .
          python -m coverage report
          python -m coverage xml

      # Uploads coverage.xml to Codecov, which serves the README badge.
      # Without the CODECOV_TOKEN secret the upload may be rejected; that
      # must not fail the tests, so errors are not fatal.
      - uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    name: Check undefined names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Catches names that are used but never defined or imported (F821 etc.).
      # Such bugs hide in error paths that the tests do not reach.
      - name: Run ruff
        run: |
          python -m pip install ruff
          ruff check --select F821,F822,F823 --output-format github idl_parser

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # setuptools-scm needs tags for the version shown in the docs

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Same settings as Read the Docs (.readthedocs.yaml): warnings are errors.
      - name: Build HTML docs
        run: |
          python -m pip install -r docs/requirements.txt .
          python -m sphinx -W --keep-going -b html docs docs/_build/html
