name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # reused by release.yml before building

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Tests open IDL files by relative path (idls/...), so run from the repository root.
      - name: Run tests
        run: python -m unittest discover --start-directory tests --pattern '*_test.py' --top-level-directory . --verbose

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # setuptools-scm needs tags for the version shown in the docs

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Same settings as Read the Docs (.readthedocs.yaml): warnings are errors.
      - name: Build HTML docs
        run: |
          python -m pip install -r docs/requirements.txt .
          python -m sphinx -W --keep-going -b html docs docs/_build/html
